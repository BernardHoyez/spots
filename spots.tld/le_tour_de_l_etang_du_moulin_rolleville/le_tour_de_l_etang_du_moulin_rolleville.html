c","lat":49.58613,"lon":0.212094,"alt":0,"comment":"Betula pendula Voila un arbre avec une écorce blanche caractéristique. Cette écorce est lisse et marquée de lenticelles horizontales. Les feuilles sont triangulaires, pointues et dentées. La fleur prend la forme d'un chaton. Le chaton mâle est pendant. Le chaton femelle est dressé. Le bouleau blanc est encore appelé bouleau verruqueux. Ceci est dû au fait que ses jeunes branches portent des verrues de résine blanchâtre.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Bouleau verruqueux (4)","lat":49.584534,"lon":0.213667,"alt":0,"comment":"Betula pendula","photo":null,"audio":"audio/bouleau_verruqueux__4_-audio.mp3","video":null,"youtube":null},{"name":"charme","lat":49.583711,"lon":0.213712,"alt":0,"comment":"","photo":null,"audio":"audio/charme-audio.mp3","video":null,"youtube":null},{"name":"chataignier","lat":49.585137,"lon":0.215551,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne 2010 (13)","lat":49.586424,"lon":0.21204,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne pédonculé","lat":49.585617,"lon":0.21253,"alt":0,"comment":"Quercus robur Chez le chêne sessile, la base de la feuille ne présente pas d'oreillettes. Alors que chez le chêne pédonculé, il y a 2 oreillettes.","photo":null,"audio":"audio/ch_ne_p_doncul_-audio.mp3","video":null,"youtube":null},{"name":"Chêne rouge d'Amérique (1)","lat":49.583035,"lon":0.214013,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Cliquer ici pour commencer","lat":49.582923,"lon":0.21397,"alt":0,"comment":"Parcours de découverte de l'Etang du Moulin Bonjour. Vous vous trouvez à l'entrée du site de l'Etang du Moulin. Un chemin a été aménagé de manière à faire le tour de l'étang. Le long de ce parcours d'un peu plus d'un kilomètre, vous allez croiser des éléments naturels. Des arbres, des plantes ou des oiseaux. Si vous souhaitez mieux les connaître, nous allons vous y aider, pas à pas. Utilisez votre téléphone mobile et autorisez la géolocalisation. Sur la carte apparaissent des épingles avec une étiquette associée. Il suffit de cliquer sur ces","photo":null,"audio":"audio/cliquer_ici_pour_commencer-audio.mp3","video":null,"youtube":null},{"name":"Colvert","lat":49.584139,"lon":0.213822,"alt":0,"comment":"","photo":null,"audio":"audio/colvert-audio.mp3","video":null,"youtube":null},{"name":"Cornouiller male","lat":49.58505,"lon":0.212891,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Cygne","lat":49.586119569828476,"lon":0.21248728036880493,"alt":0,"comment":"","photo":null,"audio":"audio/cygne-audio.mp3","video":null,"youtube":"dQw4w9WgXcQ"},{"name":"Ecorce de frêne","lat":49.586381,"lon":0.214715,"alt":0,"comment":"L'écorce chez les jeunes arbres est lisse, de couleur gris-vert. En vieillissant l'écorce se fissure et devient rugueuse et crevassée. Ses crevasses dessinent des losanges.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"erable a feuille d'obier","lat":49.583488,"lon":0.217234,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Erable champêtre","lat":49.584998,"lon":0.212921,"alt":0,"comment":"Acer campestre","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Erable sycomore","lat":49.58581,"lon":0.212368,"alt":0,"comment":"Acer pseudoplatanus","photo":null,"audio":"audio/erable_sycomore-audio.mp3","video":null,"youtube":null},{"name":"Foulque macroule","lat":49.586023,"lon":0.212542,"alt":0,"comment":"https://www.youtube.com/embed/vtiyjy_TWv4","photo":null,"audio":null,"video":null,"youtube":"52v3bEMKiQ0"},{"name":"Four à pain","lat":49.58312,"lon":0.214427,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Frêne","lat":49.586799,"lon":0.212589,"alt":0,"comment":"","photo":null,"audio":"audio/fr_ne-audio.mp3","video":null,"youtube":null},{"name":"Frene commun (2)","lat":49.583616,"lon":0.21376,"alt":0,"comment":"Voici une jeune frêne. Regardez son écorce. Elle est grise et lisse. Vous verrez plus loin de vieux frênes; Vous constaterez qu'elle a bien changé en vieillissant.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Fuligule morillon","lat":49.584375,"lon":0.213828,"alt":0,"comment":"","photo":null,"audio":"audio/fuligule_morillon-audio.mp3","video":null,"youtube":"bLXPddcTiuM"},{"name":"Gallinule","lat":49.583766,"lon":0.214523,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Gland de chêne","lat":49.585552,"lon":0.212513,"alt":0,"comment":"","photo":null,"audio":"audio/gland_de_ch_ne-audio.mp3","video":null,"youtube":null},{"name":"hetre","lat":49.586316,"lon":0.214116,"alt":0,"comment":"Tiens voici un arbre à l'écorce lisse. Oui, c'est un hêtre. Regarde-le de loin, on dirait un pied d'éléphant. L'écorce est grise et lisse. elle est très fine. Elle présente des cicatrices. Là où il y avait une branche, il y a une cicatrice. Quand l'arbre croît, la cicatrice est étirée.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Highlands","lat":49.586534,"lon":0.213399,"alt":0,"comment":"","photo":null,"audio":"audio/highlands-audio.mp3","video":null,"youtube":"WqLglHV8PA0"},{"name":"houx","lat":49.583292,"lon":0.217044,"alt":0,"comment":"","photo":null,"audio":"audio/houx-audio.mp3","video":null,"youtube":null},{"name":"Introduction","lat":49.582983,"lon":0.213974,"alt":0,"comment":"","photo":null,"audio":"audio/introduction-audio.mp3","video":null,"youtube":null},{"name":"L'ancienne roue du moulin","lat":49.583092,"lon":0.213724,"alt":0,"comment":"Il y avait plus d'une dizaine de moulins sur la Lézarde qui étaient mûs par une roue hydraulique. De cette ancienne roue, il ne subsiste ici que l'axe.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"L'étang","lat":49.583916,"lon":0.213944,"alt":0,"comment":"","photo":null,"audio":"audio/l__tang-audio.mp3","video":null,"youtube":null},{"name":"Laurier cerise","lat":49.583846,"lon":0.215203,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Le moulin","lat":49.583347,"lon":0.214219,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Merisier","lat":49.584305,"lon":0.214853,"alt":0,"comment":"","photo":null,"audio":"audio/merisier-audio.mp3","video":null,"youtube":null},{"name":"Morelle","lat":49.585576,"lon":0.212471,"alt":0,"comment":"","photo":null,"audio":"audio/morelle-audio.mp3","video":null,"youtube":null},{"name":"Mouette rieuse","lat":49.584222,"lon":0.213831,"alt":0,"comment":"","photo":null,"audio":"audio/mouette_rieuse-audio.mp3","video":null,"youtube":null},{"name":"Noisetier","lat":49.586643,"lon":0.213384,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Noisetier","lat":49.585021,"lon":0.212898,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Noisetier","lat":49.586243,"lon":0.21208,"alt":0,"comment":"","photo":null,"audio":"audio/noisetier-audio.mp3","video":null,"youtube":null},{"name":"Noisetier fleur mâle","lat":49.585693,"lon":0.212423,"alt":0,"comment":"La fleur mâle du noisetier appelée châton. La fleur mâle, appelé chaton, se développe dès le mois de juin jusqu'à l'automne avant de rentrer en dormance jusqu'à la floraison entre mi-décembre et mars. Les chatons se déploient tout en longueur sur 5 à 10 cm en laissant leurs écailles jaunes s'ouvrir.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Ormes","lat":49.585503,"lon":0.212519,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule","lat":49.583388,"lon":0.214879,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule","lat":49.584876,"lon":0.21322,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule pleureur","lat":49.583067,"lon":0.214011,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Source","lat":49.58382,"lon":0.215281,"alt":0,"comment":"","photo":null,"audio":"audio/source-audio.mp3","video":null,"youtube":null},{"name":"Sureau","lat":49.585522,"lon":0.215292,"alt":0,"comment":"Commentaire vocal","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Sureau","lat":49.586949,"lon":0.213213,"alt":0,"comment":"Le sureau noir est une espèce d'arbuste fruitier, à feuilles caduques. Quand on casse de jeunes rameaux, on peut voir au coeur la moêlle, une substance blanche et spongieuse. Le bois est protégé par une écorce gris vert, très fissurée. La feuille est composée de 5 à 7 folioles pointues et à bord denté. Quand on frotte les feuilles, elles émettent une odeur déplaisante. Les fleurs blanches sont disposées en ombelle et elles apparaissent au début de l'été. Les fruits sont de petites baies noir violacé disposées en grappe. Les fleurs comm","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Troène","lat":49.586778,"lon":0.212409,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Tronc de saule","lat":49.583688,"lon":0.213869,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Vieux frêne","lat":49.58691,"lon":0.213124,"alt":0,"comment":"Comparez l'écorce de ce vieux frêne avec celle du jeune frêne. Celle-ci s'est craquelée. Les lames d'écorce forment des losanges.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Yucca","lat":49.586567,"lon":0.212115,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null}];
